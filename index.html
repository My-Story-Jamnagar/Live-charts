<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Live Stock Charts</title>
    <style>
        html, body { overflow-x: hidden; }
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 10px; }
        h1 { text-align: center; color: #333; font-size: 20px; }
        .info { text-align: center; font-size: 14px; color: #666; margin-bottom: 15px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(350px, 100%), 1fr)); gap: 15px; }
        .stock-card { min-width: 0; background: #fff; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); padding: 10px; }
        .stock-name { font-size: 16px; font-weight: bold; color: #004aad; text-align: center; }
        .stock-sym { font-size: 12px; color: #888; text-align: center; margin: 2px 0 8px; }
        .stock-link { display: block; text-align: center; font-size: 13px; margin-top: 8px; color: #004aad; text-decoration: none; }
        .tradingview-widget-container { height: 450px; width: 100%; }
        .tradingview-widget-container__widget { height: 100%; width: 100%; }
        #page { transform-origin: 0 0; }

        /* તરતું (floating) કોમ્બો કંટ્રોલ */
        .fab-wrap { position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
                    z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; touch-action: manipulation; }
        .fab-panel { display: none; flex-direction: column; gap: 6px; background: rgba(255,255,255,0.45); border-radius: 14px; padding: 8px;
                     max-width: calc(100vw - 24px); box-sizing: border-box; }
        .fab-panel.open { display: flex; }
        .fab-row { display: flex; gap: 6px; align-items: center; justify-content: center; }
        .fab-btn { width: 44px; height: 44px; border: none; border-radius: 50%; background: rgba(0,74,173,0.45); color: #fff;
                   font-size: 20px; line-height: 1; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .fab-btn:active { background: rgba(0,48,122,0.85); }
        .fab-main { width: 52px; height: 52px; font-size: 22px; }
        .fab-zoom { min-width: 52px; text-align: center; font-size: 13px; font-weight: bold; color: #000; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
    </style>
</head>
<body>
<div id="page">

    <h1>લાઇવ ચાર્ટ્સ (TradingView)</h1>
    <div class="info">
        (ચાર્ટની ઉપરના બટનથી તમે ડેઇલી/વિકલી, કેન્ડલ/લાઇન અને વર્ષોનો સમયગાળો બદલી શકો છો)<br>
        નોંધ: મફત વિજેટમાં NSE ઉપલબ્ધ નથી, એટલે BSE ના (દિવસના અંતના) ભાવ દેખાય છે.
    </div>

    <div class="grid-container" id="charts-container"></div>

    </div><!-- /#page -->

    <script>
        // symbol = ચાર્ટમાં દેખાતો BSE સિમ્બોલ (મફત વિજેટ માટે)
        // nse    = નીચેની "NSE ચાર્ટ ખોલો" લિંક માટે (tradingview.com પર NSE ચાલે છે)
        const stocks = [
            // --- પ્રથમ યાદી (18 સ્ટોક્સ) ---
            { name: "Lenskart Solutions",       symbol: "BSE:LENSKART",      nse: "NSE:LENSKART" },
            { name: "Kwality Pharmaceuticals",  symbol: "BSE:KWALITY",       nse: "NSE:KWALITY" },
            { name: "Acutaas Chemicals",        symbol: "BSE:ACUTAAS",       nse: "NSE:ACUTAAS" },   // ન ચાલે તો BSE:543349
            { name: "Timex Group India",        symbol: "BSE:TIMEX",         nse: "NSE:TIMEX" },
            { name: "Fredun Pharmaceuticals",   symbol: "BSE:FREDUN",        nse: "NSE:FREDUN" },
            { name: "Aarti Pharmalabs",         symbol: "BSE:AARTIPHARM",    nse: "NSE:AARTIPHARM" },
            { name: "Saregama India",           symbol: "BSE:SAREGAMA",      nse: "NSE:SAREGAMA" },
            { name: "Rubicon Research",         symbol: "BSE:RUBICON",       nse: "NSE:RUBICON" },
            { name: "Sky Gold And Diamonds",    symbol: "BSE:SKYGOLD",       nse: "NSE:SKYGOLD" },
            { name: "Gland Pharma",             symbol: "BSE:GLAND",         nse: "NSE:GLAND" },
            { name: "Laurus Labs",              symbol: "BSE:LAURUSLABS",    nse: "NSE:LAURUSLABS" },
            { name: "Alivus Life Sciences",     symbol: "BSE:ALIVUS",        nse: "NSE:ALIVUS" },
            { name: "Navin Fluorine Intl",      symbol: "BSE:NAVINFLUOR",    nse: "NSE:NAVINFLUOR" },
            { name: "Divis Laboratories",       symbol: "BSE:DIVISLAB",      nse: "NSE:DIVISLAB" },
            { name: "Kernex Microsys",          symbol: "BSE:KERNEX",        nse: "NSE:KERNEX" },
            { name: "Craftsman Automation",     symbol: "BSE:CRAFTSMAN",     nse: "NSE:CRAFTSMAN" },
            { name: "Multi Commodity Exch (MCX)",symbol: "BSE:MCX",          nse: "NSE:MCX" },
            { name: "Satin Creditcare Network", symbol: "BSE:SATIN",         nse: "NSE:SATIN" },

            // --- બીજી યાદી (Master Score વાળી 30 સ્ટોક્સ) ---
            { name: "Marine Electricals",       symbol: "BSE:MARINE",        nse: "NSE:MARINE" },
            { name: "Sansera Engineering",      symbol: "BSE:SANSERA",       nse: "NSE:SANSERA" },
            { name: "Minda Corporation",        symbol: "BSE:MINDACORP",     nse: "NSE:MINDACORP" },
            { name: "Lumax Auto Tech",          symbol: "BSE:LUMAXTECH",     nse: "NSE:LUMAXTECH" },
            { name: "Honasa Consumer Ltd",      symbol: "BSE:HONASA",        nse: "NSE:HONASA" },
            { name: "SG Finserve",              symbol: "BSE:SGFIN",         nse: "NSE:SGFIN" },
            { name: "KDDL",                     symbol: "BSE:KDDL",          nse: "NSE:KDDL" },
            { name: "Nitin Spinners",           symbol: "BSE:NITINSPIN",     nse: "NSE:NITINSPIN" },
            { name: "Indo Count Inds",          symbol: "BSE:ICIL",          nse: "NSE:ICIL" },
            { name: "Krishana Phoschem",        symbol: "BSE:KRISHANA",      nse: "NSE:KRISHANA" },
            { name: "Pic Industries",           symbol: "BSE:PICIND",        nse: "NSE:PICIND" },
            { name: "Engineers India",          symbol: "BSE:ENGINERSIN",    nse: "NSE:ENGINERSIN" },
            { name: "Pearl Global Industries",  symbol: "BSE:PGIL",          nse: "NSE:PGIL" },
            { name: "A S M Technologies",       symbol: "BSE:ASMTEC",        nse: "NSE:ASMTEC" },
            { name: "Raghav Productivity Enh",  symbol: "BSE:RPEL",          nse: "NSE:RPEL" },
            { name: "TVS Motor",                symbol: "BSE:TVSMOTOR",      nse: "NSE:TVSMOTOR" },
            { name: "VRL Logistics",            symbol: "BSE:VRLLOG",        nse: "NSE:VRLLOG" },
            { name: "Billionbrains Garage Vent",symbol: "BSE:BBGVL",         nse: "NSE:BBGVL" },
            { name: "Radio Khaitan",            symbol: "BSE:RADIOKHAITAN",  nse: "NSE:RADIOKHAITAN" },
            { name: "TCPL Packaging",           symbol: "BSE:TCPLPACK",      nse: "NSE:TCPLPACK" },
            { name: "Esaf E-Commerce Venture",  symbol: "BSE:ESAFSFB",       nse: "NSE:ESAFSFB" },
            { name: "Rane (Madras)",            symbol: "BSE:RML",           nse: "NSE:RML" },
            { name: "MM Forgings",              symbol: "BSE:MMFL",          nse: "NSE:MMFL" },
            { name: "Asahi India Glass",        symbol: "BSE:ASAHIINDIA",    nse: "NSE:ASAHIINDIA" },
            { name: "Entero Healthcare Soluti", symbol: "BSE:ENTERO",        nse: "NSE:ENTERO" },
            { name: "Titan Company",            symbol: "BSE:TITAN",         nse: "NSE:TITAN" },
            { name: "Marksans Pharma",          symbol: "BSE:MARKSANS",      nse: "NSE:MARKSANS" },
            { name: "Sai Life Sciences",        symbol: "BSE:SAILIFE",       nse: "NSE:SAILIFE" },
            { name: "Kings Infra & Tech",       symbol: "BSE:KINGINFRA",     nse: "NSE:KINGINFRA" },
            { name: "Ipca Laboratories",        symbol: "BSE:IPCALAB",       nse: "NSE:IPCALAB" }
        ];

        const container = document.getElementById('charts-container');

        stocks.forEach(stock => {
            const card = document.createElement('div');
            card.className = 'stock-card';

            const title = document.createElement('div');
            title.className = 'stock-name';
            title.textContent = stock.name;
            card.appendChild(title);

            // કયો સિમ્બોલ માંગ્યો છે તે દેખાય, જેથી Apple આવે તો તરત ખબર પડે
            const sym = document.createElement('div');
            sym.className = 'stock-sym';
            sym.textContent = stock.symbol;
            card.appendChild(sym);

            const widgetContainer = document.createElement('div');
            widgetContainer.className = 'tradingview-widget-container';

            const widgetInner = document.createElement('div');
            widgetInner.className = 'tradingview-widget-container__widget';
            widgetContainer.appendChild(widgetInner);

            const script = document.createElement('script');
            script.type = 'text/javascript';
            script.async = true;
            script.text = JSON.stringify({
                "autosize": true,
                "symbol": stock.symbol,
                "interval": "D",
                "timezone": "Asia/Kolkata",
                "theme": "light",
                "style": "1",
                "locale": "en",
                "enable_publishing": false,
                "hide_side_toolbar": true,
                "allow_symbol_change": false,
                "calendar": false,
                "support_host": "https://www.tradingview.com"
            });
            script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
            widgetContainer.appendChild(script);
            card.appendChild(widgetContainer);

            const link = document.createElement('a');
            link.className = 'stock-link';
            link.target = '_blank';
            link.rel = 'noopener';
            link.href = 'https://www.tradingview.com/chart/?symbol=' + encodeURIComponent(stock.nse);
            link.textContent = 'NSE ચાર્ટ TradingView પર ખોલો ↗';
            card.appendChild(link);

            container.appendChild(card);
        });
    </script>

    <div class="fab-wrap" id="fab">
        <div class="fab-panel" id="fabPanel">
            <div class="fab-row">
                <button class="fab-btn" data-act="top"    aria-label="સૌથી ઉપર">⇈</button>
                <button class="fab-btn" data-act="up"     aria-label="ઉપર સ્ક્રોલ">▲</button>
                <button class="fab-btn" data-act="down"   aria-label="નીચે સ્ક્રોલ">▼</button>
                <button class="fab-btn" data-act="bottom" aria-label="સૌથી નીચે">⇊</button>
            </div>
            <div class="fab-row">
                <button class="fab-btn" data-act="zoomout" aria-label="ઝૂમ આઉટ">−</button>
                <span class="fab-zoom" id="zoomLabel">100%</span>
                <button class="fab-btn" data-act="zoomin"  aria-label="ઝૂમ ઇન">+</button>
            </div>
        </div>
        <button class="fab-btn fab-main" id="fabMain" aria-label="સ્ક્રોલ અને ઝૂમ">☰</button>
    </div>

    <script>
        (function () {
            const page = document.getElementById('page');
            const panel = document.getElementById('fabPanel');
            const main = document.getElementById('fabMain');
            const label = document.getElementById('zoomLabel');
            const hasZoom = !!(window.CSS && CSS.supports && CSS.supports('zoom', '1'));
            let z = 1;

            function applyZoom() {
                z = Math.min(2, Math.max(0.5, Math.round(z * 10) / 10));
                if (hasZoom) {
                    page.style.zoom = z;
                } else {                       // જૂના બ્રાઉઝર માટે વિકલ્પ
                    page.style.transform = 'scale(' + z + ')';
                    page.style.width = (100 / z) + '%';
                }
                label.textContent = Math.round(z * 100) + '%';
            }

            function scrollStep(dir) {
                window.scrollBy({ top: dir * window.innerHeight * 0.8, behavior: 'smooth' });
            }

            main.addEventListener('click', function () {
                const open = panel.classList.toggle('open');
                main.textContent = open ? '✕' : '☰';
            });

            panel.addEventListener('click', function (e) {
                const b = e.target.closest('button');
                if (!b) return;
                switch (b.dataset.act) {
                    case 'up':      scrollStep(-1); break;
                    case 'down':    scrollStep(1); break;
                    case 'top':     window.scrollTo({ top: 0, behavior: 'smooth' }); break;
                    case 'bottom':  window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' }); break;
                    case 'zoomin':  z += 0.1; applyZoom(); break;
                    case 'zoomout': z -= 0.1; applyZoom(); break;
                }
            });
        })();
    </script>
</body>
</html>
